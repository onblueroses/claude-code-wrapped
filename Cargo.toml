[package]
name = "claude-code-wrapped"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Spotify Wrapped for your Claude Code usage — cost estimates, cache shares, model mix, archetypes, and a shareable card."
repository = "https://github.com/onblueroses/claude-code-wrapped"
homepage = "https://github.com/onblueroses/claude-code-wrapped"
keywords = ["claude", "ai", "analytics", "usage", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ccwrapped"
path = "src/main.rs"

[lib]
name = "ccwrapped"
path = "src/lib.rs"

[dependencies]
bincode = "1.3.3"
blake3 = "1.8.5"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.3.4"
iana-time-zone = "0.1.65"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
termcolor = "1"
unicode-width = "0.2.2"
zstd = "0.13.3"

[dev-dependencies]
termcolor = "1"
