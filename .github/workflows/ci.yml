name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: msrv
      - run: cargo check --all-targets --locked

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install screenshot narrative scanner
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck tesseract-ocr
          tesseract --version
      - run: cargo build --release --locked
      - run: cargo test --all-targets --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --manifest-path tests/support/report-source-audit/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: shellcheck scripts/*.sh
      - run: scripts/verify-readme-assets-container.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: windows
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --test phase4_product f050_default_json_and_private_content_outputs_remain_isolated --locked
      - run: cargo test --test phase5_scale f055_windows_timestamp_preserving_rewrite_invalidates_store --locked
      - run: cargo test --test phase5_scale f056_store_is_private_corruption_is_explicit_and_rebuild_is_source_safe --locked
