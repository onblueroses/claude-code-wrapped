name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Require the release commit to be merged into main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Require the tag to match Cargo.toml exactly
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          expected = f"v{manifest['package']['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"release tag {actual!r} must exactly match package version {expected!r}"
              )
          PY

  verify-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
      - run: cargo check --all-targets --locked

  verify-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: clippy, rustfmt
      - name: Install repository verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck tesseract-ocr
      - run: cargo fmt --all -- --check
      - run: cargo clippy --manifest-path tests/support/report-source-audit/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - run: shellcheck scripts/*.sh
      - run: scripts/verify-readme-assets-container.sh

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: release-windows
      - name: Create protected Windows test root
        run: |
          $workspaceDrive = [System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)
          $testRoot = Join-Path $workspaceDrive "ccwrapped-tests-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $testRoot | Out-Null
          $currentSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls.exe $testRoot /inheritance:r /grant:r ("*" + $currentSid + ":(OI)(CI)F")
          if ($LASTEXITCODE -ne 0) {
            throw "failed to protect the Windows test root"
          }
          "CCWRAPPED_WINDOWS_TEST_ROOT=$testRoot" >> $env:GITHUB_ENV
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --test phase4_product f050_default_json_and_private_content_outputs_remain_isolated --locked
      - run: cargo test --test phase5_scale f055_windows_timestamp_preserving_rewrite_invalidates_store --locked
      - run: cargo test --test phase5_scale f056_store_is_private_corruption_is_explicit_and_rebuild_is_source_safe --locked

  build:
    needs: [verify-tag, verify-msrv, verify-current, verify-windows]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../ccwrapped-${{ matrix.target }}.tar.gz ccwrapped
          cd ../../..

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../ccwrapped-${{ matrix.target }}.zip ccwrapped.exe
          cd ../../..

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ccwrapped-${{ matrix.target }}
          path: ccwrapped-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - name: Publish offline-verifiable checksums
        run: sha256sum ccwrapped-*.tar.gz ccwrapped-*.zip > SHA256SUMS

      - name: Attest release archives and checksum manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ccwrapped-*.tar.gz
            ccwrapped-*.zip
            SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            ccwrapped-*
            SHA256SUMS
